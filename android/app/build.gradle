plugins {
    id 'com.android.application'
}

android {
    namespace 'app.shebloomswealth.mobile'
    compileSdk 36

    defaultConfig {
        applicationId "app.shebloomswealth.mobile"
        minSdk 23
        targetSdk 35
        versionCode 29
        versionName "1.0.28"

        manifestPlaceholders = [
            hostName        : "shebloomswealth.app",
            defaultUrl      : "https://shebloomswealth.app",
            launcherName    : "Bloom",
            assetStatements : '[{ "relation": ["delegate_permission/common.handle_all_urls"], "target": { "namespace": "web", "site": "https://shebloomswealth.app" } }]'
        ]
    }

    signingConfigs {
        release {
            storeFile file("../../signing.keystore")
            storePassword "KxOqlCPuZUce"
            keyAlias "my-key-alias"
            keyPassword "KxOqlCPuZUce"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        force 'com.android.billingclient:billing:8.0.0'
        force 'com.android.billingclient:billing-ktx:8.0.0'
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.3'
    implementation 'com.google.androidbrowserhelper:billing:1.2.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
