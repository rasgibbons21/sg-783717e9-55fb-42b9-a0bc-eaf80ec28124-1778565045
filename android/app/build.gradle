plugins {
    id 'com.android.application'
}

android {
    namespace 'app.shebloomswealth.mobile'
    compileSdk 35

    defaultConfig {
        applicationId "app.shebloomswealth.mobile"
        minSdk 19
        targetSdk 35
        versionCode 2
        versionName "1.0.1"

        manifestPlaceholders = [
            hostName        : "shebloomswealth.app",
            defaultUrl      : "https://shebloomswealth.app",
            launcherName    : "Bloom",
            assetStatements : '[{ "relation": ["delegate_permission/common.handle_all_urls"], "target": { "namespace": "web", "site": "https://shebloomswealth.app" } }]'
        ]
    }

    signingConfigs {
        release {
            storeFile file("../../signing.keystore")
            storePassword "KxOqlCPuZUce"
            keyAlias "my-key-alias"
            keyPassword "KxOqlCPuZUce"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
