<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — Bloom</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0E1B30;
    color: #F4F7FA;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
    text-align: center;
  }
  .container { max-width: 400px; }
  .icon { font-size: 4rem; margin-bottom: 1.5rem; }
  h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
  p { color: #9DB2CC; line-height: 1.6; margin-bottom: 1.5rem; }
  button {
    background: #27B7C8;
    color: #0E1B30;
    border: none;
    padding: 0.75rem 2rem;
    border-radius: 0.5rem;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
</style>
</head>
<body>
<div class="container">
  <div class="icon">🌸</div>
  <h1>You're offline</h1>
  <p>Reconnect to the internet to keep blooming.</p>
  <button onclick="location.reload()">Try Again</button>
</div>
</body>
</html>
