workflows:
  ios-build:
    name: iOS App Store Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - apple_credentials
      node: 18
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Add iOS platform
        script: npx cap add ios || true
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive
    artifacts:
      - ios/App/build/App.xcarchive
      - ios/App/build/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-build:
    name: Android Play Store Build
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      groups:
        - android_credentials
      node: 18
      java: 17
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Install Bubblewrap
        script: npm install -g @aspect-build/rules_js || npm install -g @nicolo-ribaudo/chokidar-2 || true
      - name: Generate TWA project
        script: |
          npm install -g @nicolo-ribaudo/chokidar-2 || true
          npx @aspect-build/rules_js || true
          node scripts/build-twa.mjs || {
            echo "Direct build failed, using Gradle wrapper"
            ./gradlew assembleRelease bundleRelease
          }
    artifacts:
      - app-release-bundle.aab
      - app-release-signed.apk
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: production
